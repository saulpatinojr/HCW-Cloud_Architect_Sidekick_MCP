name: ci-cd

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      environment:
        description: azd environment to deploy (must exist as a protected GitHub environment)
        type: choice
        options: [ adr-dev ]
        default: adr-dev
        required: true

# Least privilege: no token permissions by default; each job requests only what it needs.
permissions: {}

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  build-test:
    name: Build, test, scan
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      pull-requests: read    # gitleaks lists the pull request's commits
    outputs:
      deploy: ${{ steps.changes.outputs.deploy }}   # 'false' when a push to main changes nothing that ships to Azure
    steps:
      - uses: actions/checkout@v7
        with: { fetch-depth: 0 }   # full history for secret scanning (and the deploy-relevance diff below)

      # First, before any pull-request code runs (it could otherwise plant a .gitleaksignore), and independent of test results.
      - name: Secret scan (gitleaks)
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e   # v3.0.0 (pins the gitleaks binary too)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_COMMENTS: "false"   # findings fail the job and appear in the log; no pull-requests: write needed

      - name: Start Azurite (storage emulator)
        # The Storage SDK targets service API versions newer than the latest Azurite release, so the emulator runs with
        # --skipApiVersionCheck (Azurite's documented switch). Production always uses real Azure Storage.
        run: |
          docker run -d --name azurite -p 127.0.0.1:10000:10000 -p 127.0.0.1:10001:10001 -p 127.0.0.1:10002:10002 \
            mcr.microsoft.com/azure-storage/azurite:3.37.0 \
            azurite -l /data --blobHost 0.0.0.0 --queueHost 0.0.0.0 --tableHost 0.0.0.0 --skipApiVersionCheck --disableTelemetry
          # Ready when Azurite itself answers HTTP (an unauthenticated list returns 403); 000 means not listening yet.
          for _ in $(seq 1 30); do
            b=$(curl -s -o /dev/null -w '%{http_code}' 'http://127.0.0.1:10000/devstoreaccount1?comp=list' || true)
            q=$(curl -s -o /dev/null -w '%{http_code}' 'http://127.0.0.1:10001/devstoreaccount1?comp=list' || true)
            if [ "$b" != "000" ] && [ "$q" != "000" ]; then exit 0; fi
            sleep 1
          done
          docker logs azurite; echo "::error::Azurite did not start"; exit 1

      - uses: actions/setup-dotnet@v6
        with: { global-json-file: global.json }

      - name: Restore (NuGet Audit fails on known vulnerabilities, direct and transitive)
        run: dotnet restore AdrMcp.sln

      - name: Build (Release, warnings as errors for nullable)
        run: dotnet build AdrMcp.sln -c Release --no-restore

      - name: Vulnerability check for Functions host extensions
        # The Functions SDK restores a generated WorkerExtensions project without Directory.Build.props, so NuGet Audit
        # settings never reach the host-side extension packages that ship to Azure. Fails closed if no report is produced.
        run: |
          set -euo pipefail
          proj=$(find "$PWD/src/AdrMcp.Functions/obj/Release" -path '*/WorkerExtensions/WorkerExtensions.csproj' | head -n1)
          [ -n "$proj" ] || { echo "::error::Generated WorkerExtensions project not found (this step must run after Build)"; exit 1; }
          # SDK 10+ restores implicitly, which fails for this generated project; reuse the build's restore instead
          # (SDK 8 has no such flag and never restores here).
          args=(package --vulnerable --include-transitive --format json)
          help=$(dotnet list package --help 2>&1 || true)
          case "$help" in *--no-restore*) args+=(--no-restore) ;; esac
          dotnet list "$proj" "${args[@]}" > ext-vuln.json || true
          jq -e '(.projects | length) > 0 and ((.problems // []) | length) == 0' ext-vuln.json > /dev/null 2>&1 || { cat ext-vuln.json; echo "::error::Could not produce a vulnerability report for $proj"; exit 1; }
          if jq -e '[.projects[].frameworks[]? | ((.topLevelPackages // [])[], (.transitivePackages // [])[])] | length > 0' ext-vuln.json > /dev/null; then
            jq '.projects[].frameworks' ext-vuln.json; echo "::error::Vulnerable packages in the Functions host extensions"; exit 1
          fi
          echo "Functions host extensions: no known vulnerable packages"

      - name: Install Bicep
        # The resource-naming unit tests evaluate infra/main.bicep with `bicep snapshot` (offline, no Azure sign-in); the Bicep step below reuses it.
        run: az bicep install

      - name: Unit tests
        env:
          ADR_TEST_REQUIRE_BICEP: "true"   # fail, never skip, if the Bicep CLI is missing (the naming tests need it, docs/adr/ADR-0009-azure-naming-convention.md)
        run: dotnet test tests/AdrMcp.UnitTests -c Release --no-build --logger "trx;LogFileName=unit.trx" --results-directory TestResults --collect:"XPlat Code Coverage"

      - name: Integration tests (Azurite)
        env:
          ADR_TEST_REQUIRE_AZURITE: "true"   # fail, never skip, if the emulator is unreachable
        run: dotnet test tests/AdrMcp.IntegrationTests -c Release --no-build --logger "trx;LogFileName=integration.trx" --results-directory TestResults

      - name: Upload test results and coverage
        if: always()
        uses: actions/upload-artifact@v7
        with: { name: test-results, path: TestResults, retention-days: 7, if-no-files-found: ignore }

      - name: Bicep build + lint
        run: |
          az bicep build --file infra/main.bicep --stdout > /dev/null
          az bicep lint --file infra/main.bicep

      - name: Contract docs are up to date
        run: |
          dotnet run --project tools/AdrMcp.DocGen -c Release -- /tmp/contracts.md
          diff -q /tmp/contracts.md docs/03-mcp-contracts.md || { echo "::error::docs/03-mcp-contracts.md is stale; run tools/AdrMcp.DocGen"; exit 1; }

      - name: Publish Functions package
        run: dotnet publish src/AdrMcp.Functions -c Release -o publish/api
      - uses: actions/upload-artifact@v7
        with: { name: api, path: publish/api, retention-days: 7 }

      - name: Does this push change what is deployed?
        # A push that changes only docs, tests or repository tooling would still queue a deploy waiting for approval,
        # and an unanswered approval holds the environment's concurrency group, so every later deploy queues behind it.
        id: changes
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.ADR_DEPLOY_ENABLED == 'true'
        env:
          BEFORE: ${{ github.event.before }}
          # Paths that never reach Azure. Every other path deploys, including paths added later (fail safe), and so does
          # a change to this workflow, so the deploy job's own steps are exercised.
          NOT_DEPLOYED: '^(docs|tests|samples|tools|src/VaultMcp|infra/vault|\.vscode|\.claude|\.github)/|\.md$|^(LICENSE|\.gitignore|\.gitattributes|\.mcp\.json)$'
        run: |
          deploy=true
          # Without the previous main commit (first push, force push) the change set is unknown: deploy.
          if git cat-file -e "${BEFORE}^{commit}" 2>/dev/null; then
            changed=$(git diff --name-only "$BEFORE" "$GITHUB_SHA")
            deployable=$(grep -Ev "$NOT_DEPLOYED" <<< "$changed" | grep . || true)
            if grep -qxF '.github/workflows/ci-cd.yml' <<< "$changed"; then deployable="$deployable .github/workflows/ci-cd.yml"; fi
            [ -n "$deployable" ] || deploy=false
          fi
          echo "deploy=$deploy" >> "$GITHUB_OUTPUT"
          if [ "$deploy" = false ]; then
            msg="Only documentation, tests or repository tooling changed, so nothing new ships and no approval is requested. Run the workflow manually to deploy anyway."
            echo "::notice title=Deploy skipped::$msg"
            echo "**Deploy skipped:** $msg" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Explain skipped deploy
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.ADR_DEPLOY_ENABLED != 'true'
        run: |
          msg="Deploy is not enabled for this repository. Create the protected adr-dev environment and OIDC identity first, then set the repository variable ADR_DEPLOY_ENABLED=true (docs/07-tests-and-ci.md)."
          echo "::notice title=Deploy skipped::$msg"
          echo "**Deploy skipped:** $msg" >> "$GITHUB_STEP_SUMMARY"

  deploy:
    name: Provision + deploy (OIDC)
    needs: build-test                      # blocked unless every required check above passed
    # Explicit opt-in (repository variable) so forks and unconfigured clones never deploy, and only main is deployable.
    # A push deploys only when it changes something that ships (build-test's `deploy` output); a manual run always deploys.
    if: vars.ADR_DEPLOY_ENABLED == 'true' && github.ref == 'refs/heads/main' && (github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && needs.build-test.outputs.deploy == 'true'))
    runs-on: ubuntu-24.04                  # pinned: the ubuntu-latest move to Ubuntu 26 reaches build-test first, never a deploy mid-flight
    timeout-minutes: 60
    permissions:
      contents: read
      id-token: write                      # OIDC federation to Azure (no long-lived credentials)
    environment: ${{ github.event.inputs.environment || 'adr-dev' }}   # protected environment: required reviewers = human approval gate
    concurrency:                           # one deployment per environment at a time; never cancel one mid-flight
      group: deploy-${{ github.event.inputs.environment || 'adr-dev' }}
      cancel-in-progress: false
    env:
      AZURE_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}          # app registration with federated credential for this repo/environment
      AZURE_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
      AZURE_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      AZURE_ENV_NAME: ${{ github.event.inputs.environment || 'adr-dev' }}
      AZURE_LOCATION: ${{ vars.AZURE_LOCATION }}
      ADR_AUTH_MODE: ${{ vars.ADR_AUTH_MODE || 'FunctionKey' }}
      ADR_PRIVATE_NETWORKING: ${{ vars.ADR_PRIVATE_NETWORKING || 'false' }}
      ADR_ENTRA_CLIENT_ID: ${{ vars.ADR_ENTRA_CLIENT_ID }}   # required only when ADR_AUTH_MODE=EntraBuiltIn
      ADR_ENTRA_TENANT_ID: ${{ vars.ADR_ENTRA_TENANT_ID }}   # optional; empty = deployment tenant
      ADR_ENTRA_ALLOWED_CLIENT_IDS: ${{ vars.ADR_ENTRA_ALLOWED_CLIENT_IDS }}   # EntraBuiltIn: comma-separated client IDs allowed to call
      ADR_ENTRA_VALIDATE_IN_APP: ${{ vars.ADR_ENTRA_VALIDATE_IN_APP || 'false' }}   # EntraBuiltIn: also verify the bearer token inside the app (ADR-0008); off until the runbook passes
      # EntraBuiltIn, opt-in: when the repository variable ADR_ENTRA_PIPELINE_READ is true, this job's own federated identity (AZURE_CLIENT_ID) is
      # allowed to call the server as an application (read-only by rule in the app) and the post-deploy smoke test runs with its token (docs/11).
      ADR_ENTRA_PIPELINE_CLIENT_ID: ${{ vars.ADR_ENTRA_PIPELINE_READ == 'true' && vars.AZURE_CLIENT_ID || '' }}
      ADR_ENTRA_RESOURCE_URI: ${{ vars.ADR_ENTRA_RESOURCE_URI }}   # optional: canonical MCP URL on a custom domain; empty = the default host name
      ADR_NAME_SUFFIX: ${{ vars.ADR_NAME_SUFFIX }}   # optional: appended to the four globally unique names when one is taken (ADR-0009); empty = none
    steps:
      - name: Preflight (required configuration)
        run: |
          missing=""
          for v in AZURE_CLIENT_ID AZURE_TENANT_ID AZURE_SUBSCRIPTION_ID AZURE_LOCATION; do [ -n "${!v}" ] || missing="$missing $v"; done
          if [ "$ADR_AUTH_MODE" = "EntraBuiltIn" ]; then
            for v in ADR_ENTRA_CLIENT_ID ADR_ENTRA_ALLOWED_CLIENT_IDS; do [ -n "${!v}" ] || missing="$missing $v"; done
          fi
          if [ "$ADR_ENTRA_VALIDATE_IN_APP" = "true" ] && [ "$ADR_AUTH_MODE" != "EntraBuiltIn" ]; then
            echo "::error::ADR_ENTRA_VALIDATE_IN_APP=true needs ADR_AUTH_MODE=EntraBuiltIn (it would otherwise be ignored)"; exit 1
          fi
          if [ -n "$ADR_ENTRA_PIPELINE_CLIENT_ID" ] && [ "$ADR_AUTH_MODE" != "EntraBuiltIn" ]; then
            echo "::error::ADR_ENTRA_PIPELINE_READ=true needs ADR_AUTH_MODE=EntraBuiltIn (there is no application sign-in in FunctionKey mode)"; exit 1
          fi
          if [ -n "$missing" ]; then echo "::error::ADR_DEPLOY_ENABLED is true but these variables are empty:$missing"; exit 1; fi
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with: { global-json-file: global.json }
      # Non-GitHub actions in the job that can mint Azure tokens are pinned to commit SHAs (Dependabot updates them).
      - uses: Azure/setup-azd@0b7e3a35ab00f2eee7080c845eb39c3f0ebfa553   # v2.4.0
      - name: Azure login (federated identity, no secrets)
        uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906   # v3.1.0
        with:
          client-id: ${{ env.AZURE_CLIENT_ID }}
          tenant-id: ${{ env.AZURE_TENANT_ID }}
          subscription-id: ${{ env.AZURE_SUBSCRIPTION_ID }}
      - name: azd login (federated)
        run: azd auth login --client-id "$AZURE_CLIENT_ID" --federated-credential-provider github --tenant-id "$AZURE_TENANT_ID"
      - name: Preview (what-if plan, recorded in the job log; the environment approval happens before this job starts)
        # Resolves infra/main.parameters.json exactly as the next step does, so the plan matches what is applied.
        # azd skips provision hooks in preview mode, so postprovision.sh does not run here.
        run: azd provision --preview --no-prompt
      - name: Provision
        run: azd provision --no-prompt
      - name: Deploy
        # On a first deployment the app identity's role on the deployment container may still be propagating (403); retry briefly.
        run: |
          for attempt in 1 2 3; do
            azd deploy api --no-prompt && exit 0
            [ "$attempt" -lt 3 ] && { echo "Deploy attempt $attempt failed; retrying in 60s"; sleep 60; }
          done
          echo "::error::azd deploy failed after 3 attempts"; exit 1
      - name: Wait for the app to start
        # The health probe is anonymous in both auth modes. If it never answers, the worker failed at startup: check the logs,
        # e.g. an unresolved Key Vault reference for Adr__PrincipalHashSalt (fixed by restarting once the secret is readable).
        # A 503 in Entra mode means the worker does not see App Service Authentication (WEBSITE_AUTH_ENABLED) and would reject every call.
        run: |
          URL=$(azd env get-value MCP_ENDPOINT); BASE="${URL%/runtime/webhooks/mcp}"
          for _ in $(seq 1 30); do
            [ "$(curl -s -o /dev/null -w '%{http_code}' --max-time 10 "$BASE/api/health" || true)" = "200" ] && exit 0
            sleep 10
          done
          echo "::error::$BASE/api/health did not return 200 within 5 minutes"; exit 1
      - name: Smoke test (key fetched into a masked variable, never echoed)
        if: env.ADR_AUTH_MODE == 'FunctionKey'
        run: |
          APP=$(azd env get-value AZURE_FUNCTION_APP_NAME); RG=$(azd env get-value AZURE_RESOURCE_GROUP); URL=$(azd env get-value MCP_ENDPOINT)
          # The mcp_extension system key is created on the host's first start, so poll for it.
          KEY=""
          for _ in $(seq 1 18); do
            KEY=$(az functionapp keys list -g "$RG" -n "$APP" --query systemKeys.mcp_extension -o tsv 2>/dev/null || true)
            [ -n "$KEY" ] && break
            sleep 10
          done
          [ -n "$KEY" ] || { echo "::error::mcp_extension system key not available after 3 minutes"; exit 1; }
          echo "::add-mask::$KEY"
          ADR_MCP_KEY="$KEY" python3 scripts/smoke-test.py --url "$URL"   # key via environment, not the command line
      - name: Verify unauthenticated MCP calls are rejected (Entra mode)
        # The webhook is Anonymous in this mode, so App Service Authentication is the only gate: prove it is on before finishing.
        if: env.ADR_AUTH_MODE == 'EntraBuiltIn'
        run: |
          URL=$(azd env get-value MCP_ENDPOINT)
          code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 10 -X POST -H 'Content-Type: application/json' -d '{}' "$URL" || true)
          [ "$code" = "401" ] || { echo "::error::Unauthenticated POST to the MCP endpoint returned $code, expected 401. Check App Service Authentication (authsettingsV2)."; exit 1; }
          if [ -z "$ADR_ENTRA_PIPELINE_CLIENT_ID" ]; then
            echo "::notice title=Tool smoke test skipped::EntraBuiltIn needs a token; set the repository variable ADR_ENTRA_PIPELINE_READ=true after the runbook (docs/11-entra-sign-in.md), or run ADR_MCP_BEARER=<token> scripts/smoke-test.py yourself (docs/06-claude-connection.md)."
          fi
      - name: Read-only smoke test as the pipeline (Entra mode, opt-in)
        # The job's federated identity holds the application role Adr.Reader.Application on the server app (docs/11). Its token has no user,
        # so the app caps it at Reader: the script proves the read tools answer and that a write is refused with FORBIDDEN.
        if: env.ADR_AUTH_MODE == 'EntraBuiltIn' && env.ADR_ENTRA_PIPELINE_CLIENT_ID != ''
        run: |
          URL=$(azd env get-value MCP_ENDPOINT)
          TOKEN=$(az account get-access-token --scope "api://$ADR_ENTRA_CLIENT_ID/.default" --query accessToken -o tsv)
          [ -n "$TOKEN" ] || { echo "::error::no access token for the server app; is the pipeline identity assigned Adr.Reader.Application and allowed as a client?"; exit 1; }
          echo "::add-mask::$TOKEN"
          ADR_MCP_BEARER="$TOKEN" python3 scripts/smoke-test.py --url "$URL" --read-only   # token via environment, not the command line
