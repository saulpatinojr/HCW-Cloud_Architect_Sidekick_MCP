version: 2
updates:
  - package-ecosystem: nuget
    directory: "/"
    schedule: { interval: weekly }
    groups:
      azure-sdk: { patterns: [ "Azure.*", "Microsoft.Azure.*" ] }
      microsoft-extensions: { patterns: [ "Microsoft.Extensions.*" ] }
  - package-ecosystem: github-actions
    directory: "/"
    schedule: { interval: weekly }
